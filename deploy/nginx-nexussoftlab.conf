# ─────────────────────────────────────────────────────────────────────────────
# Nginx site config for the Restaurant Ordering app served under
#   https://nexussoftlab.com/OrderNow
#
# Install on the EC2 box:
#   sudo cp deploy/nginx-nexussoftlab.conf /etc/nginx/sites-available/nexussoftlab
#   sudo ln -s /etc/nginx/sites-available/nexussoftlab /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d nexussoftlab.com -d www.nexussoftlab.com   # adds SSL
#
# If nexussoftlab.com already has a server block, DON'T add a second one — just
# copy the three `location /OrderNow*` blocks below into your existing block.
# ─────────────────────────────────────────────────────────────────────────────

# Map used by the socket.io / websocket proxy to negotiate the Upgrade header.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name nexussoftlab.com www.nexussoftlab.com;
    # certbot writes its ACME challenge here; everything else redirects to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# ── HTTPS ────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nexussoftlab.com www.nexussoftlab.com;

    # These two lines are added/managed automatically by `certbot --nginx`.
    ssl_certificate     /etc/letsencrypt/live/nexussoftlab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexussoftlab.com/privkey.pem;

    # Allow uploaded images up to the backend's 5 MB limit (+ headroom).
    client_max_body_size 8m;

    # Your existing main-site root can live here.
    # root /var/www/nexussoftlab-main;
    # location / { ... }

    # ── Restaurant Ordering app ──────────────────────────────────────────────

    # Normalise the bare path to the trailing-slash form.
    location = /OrderNow { return 301 /OrderNow/; }

    # Static React build (output of `vite build`, copied to /var/www/ordernow).
    # SPA fallback: unknown paths return index.html so client-side routing works.
    location /OrderNow/ {
        alias /var/www/ordernow/;
        try_files $uri $uri/ /OrderNow/index.html;

        # Hashed assets are immutable; cache them hard. index.html stays fresh.
        location ~* /OrderNow/assets/.*\.(js|css|woff2?|svg|png|jpe?g|gif|webp)$ {
            alias /var/www/ordernow/;
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── Android app download page + APK ──────────────────────────────────────
    # Landing page at https://nexussoftlab.com/OrderNow/app (users' download link).
    # Files live in /var/www/ordernow-app/ (index.html + ordernow.apk).
    location = /OrderNow/app { return 301 /OrderNow/app/; }
    location /OrderNow/app/ {
        alias /var/www/ordernow-app/;
        try_files $uri $uri/ /OrderNow/app/index.html;
    }
    # Serve the APK with the correct type + as a forced download.
    location = /OrderNow/app/ordernow.apk {
        alias /var/www/ordernow-app/ordernow.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="OrderNow.apk"';
    }

    # REST API → backend :3007 (the /OrderNow prefix is stripped here).
    location /OrderNow/api/ {
        proxy_pass http://127.0.0.1:3007/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded images → backend static /uploads (prefix stripped).
    location /OrderNow/uploads/ {
        proxy_pass http://127.0.0.1:3007/uploads/;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.io (websockets). Passed through verbatim — the backend's
    # SOCKET_PATH is /OrderNow/socket.io, so NO prefix stripping here.
    location /OrderNow/socket.io/ {
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # keep long-lived sockets open
    }
}
